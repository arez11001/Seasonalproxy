<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Seasonal Os Proxy</title>
		<meta name="theme-color" content="#071d34" />
		<link rel="icon" type="image/jpeg" href="/seasonal-os-logo.jpg" />
		<meta name="description" content="Seasonal Os Proxy — a clean, blue-and-white web browsing experience." />
		<link rel="stylesheet" href="/styles.css" />
		<meta name="robots" content="noindex" />
	</head>

	<body>
		<header class="brandbar">
			<div class="brandmark">
				<img src="/seasonal-os-logo.jpg" alt="Seasonal OS leaf logo" />
			</div>
			<div class="brandcopy">
				<strong>Seasonal OS <span>Proxy</span></strong>
				<small>Your space to explore the web</small>
			</div>
			<div class="brand-pill"><span></span> Browser</div>
		</header>
		<div class="toolbar">
			<div class="toolbar__left">
				<button id="back" type="button" aria-label="Back" title="Back">
					←
				</button>
				<button
					id="forward"
					type="button"
					aria-label="Forward"
					title="Forward"
				>
					→
				</button>
				<button id="reload" type="button" aria-label="Reload" title="Reload">↻</button>
			</div>

			<form id="omnibox" class="omnibox" role="search">
				<input
					id="address"
					type="text"
					name="address"
					placeholder="Search the web or enter a website address"
					autocomplete="off"
					autocapitalize="off"
					spellcheck="false"
					enterkeyhint="go"
					aria-label="Address"
				/>
			</form>

			<div class="toolbar__right">
				<button id="bookmark" type="button" aria-pressed="false">
					☆
				</button>
				<button id="menu-toggle" type="button" aria-expanded="false">
					☰
				</button>
			</div>
		</div>

		<div id="menu" class="menu" hidden>
			<button data-popup="settings" type="button">Settings</button>
			<button data-popup="history" type="button">History</button>
			<button data-popup="bookmarks" type="button">Bookmarks</button>
		</div>

		<div id="popup" class="popup" hidden>
			<section
				class="popup__panel"
				role="dialog"
				aria-modal="true"
				aria-labelledby="popup-title"
			>
				<header class="popup__header">
					<span id="popup-title"></span>
					<button
						id="popup-close"
						type="button"
						aria-label="Close menu"
					>
						close
					</button>
				</header>
				<iframe
					id="popup-frame"
					class="popup__frame"
					title="Menu"
					sandbox="allow-forms allow-modals allow-popups allow-same-origin allow-scripts allow-downloads"
				></iframe>
			</section>
		</div>

		<div id="tabs" class="tabs" role="tablist"></div>

		<p id="status" class="status" role="status" hidden></p>

		<main id="frames" class="frames"></main>

		<script type="module" src="/js/app.js"></script>
	</body>
</html>
